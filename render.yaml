databases:
  - name: devcrew-db
    databaseName: devcrew
    user: devcrew
    plan: free

services:
  # DevCrew Backend (FastAPI + Uvicorn)
  - type: web
    name: devcrew-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devcrew-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://devcrew-frontend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # DevCrew Frontend (React + Vite)
  - type: web
    name: devcrew-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://devcrew-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://devcrew-backend.onrender.com

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcrew}
      POSTGRES_DB: ${POSTGRES_DB:-devcrew}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devcrew}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./workspaces:/app/workspaces
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devcrew}:${POSTGRES_PASSWORD:-devcrew}@db:5432/${POSTGRES_DB:-devcrew}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-openai/gpt-oss-20b}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-groq}
      - CODING_MODEL=${CODING_MODEL:-openai/gpt-oss-20b}
      - CODING_PROVIDER=${CODING_PROVIDER:-groq}
      - FAST_MODEL=${FAST_MODEL:-openai/gpt-oss-20b}
      - FAST_PROVIDER=${FAST_PROVIDER:-groq}
      - WORKSPACE_BASE_PATH=/app/workspaces
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-replace-in-production}
      - APP_ENV=development
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:

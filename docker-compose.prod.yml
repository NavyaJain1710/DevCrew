services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devcrew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcrew_prod_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-devcrew}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devcrew}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - devcrew_workspaces:/app/workspaces
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devcrew}:${POSTGRES_PASSWORD:-devcrew_prod_secure_password}@db:5432/${POSTGRES_DB:-devcrew}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-openai/gpt-oss-20b}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-groq}
      - CODING_MODEL=${CODING_MODEL:-openai/gpt-oss-20b}
      - CODING_PROVIDER=${CODING_PROVIDER:-groq}
      - FAST_MODEL=${FAST_MODEL:-openai/gpt-oss-20b}
      - FAST_PROVIDER=${FAST_PROVIDER:-groq}
      - WORKSPACE_BASE_PATH=/app/workspaces
      - JWT_SECRET=${JWT_SECRET}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_prod_data:
  devcrew_workspaces:
